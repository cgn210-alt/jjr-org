<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 중종로공동체 다락방별 명단</title>
  <meta name="description" content="믿음 · 소망 · 사랑 다락방과 순 구성 한눈에 보기" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="2026 중종로공동체 다락방별 명단" />
  <meta property="og:description" content="믿음 · 소망 · 사랑 다락방과 순 구성 한눈에 보기" />
  <meta property="og:url" content="https://cgn210-alt.github.io/jjr-org/org.html" />
  <meta property="og:image" content="https://cgn210-alt.github.io/jjr-org/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #f0f2f5;
      color: #1a1a1a;
      font-size: 13px;
      line-height: 1.5;
    }

    /* ── 헤더 ── */
    header {
      background: linear-gradient(135deg, #1e3a5f 0%, #2d5a8e 100%);
      color: white;
      padding: 18px 24px 16px;
    }
    .header-inner { max-width: 1100px; margin: 0 auto; }
    header a { color: #93c5fd; text-decoration: none; font-size: 12px; }
    header a:hover { text-decoration: underline; }
    header h1 { font-size: 22px; font-weight: 900; margin-top: 4px; }
    header .subtitle { font-size: 12px; color: #bfdbfe; margin-top: 2px; }

    /* ── 전체 현황 카드 ── */
    .summary-bar {
      max-width: 1100px;
      margin: 16px auto 0;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .summary-card.total {
      background: white;
      border-radius: 10px;
      padding: 14px 18px;
      text-align: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .summary-row3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .summary-card {
      background: white;
      border-radius: 10px;
      padding: 12px 8px;
      text-align: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .summary-card .num { font-size: 26px; font-weight: 900; }
    .summary-card .label { font-size: 11px; color: #888; margin-top: 2px; }
    .summary-card.total .num { font-size: 32px; color: #1e3a5f; }
    .summary-card.total .label { font-size: 12px; }
    .summary-card.faith  .num { color: #7c3aed; }
    .summary-card.hope   .num { color: #1d4ed8; }
    .summary-card.love   .num { color: #be185d; }

    /* ── 본문 ── */
    .container { max-width: 1100px; margin: 20px auto 40px; padding: 0 16px; }

    /* ── 다락방 블록 ── */
    .darakbang-block { margin-bottom: 28px; }
    .darakbang-title {
      font-size: 16px;
      font-weight: 900;
      padding: 10px 16px;
      border-radius: 8px 8px 0 0;
      color: white;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .darakbang-title .count-badge {
      font-size: 12px;
      font-weight: 700;
      background: rgba(255,255,255,0.25);
      padding: 2px 10px;
      border-radius: 20px;
    }
    .faith-bg  { background: linear-gradient(90deg, #6d28d9, #7c3aed); }
    .hope-bg   { background: linear-gradient(90deg, #1e40af, #1d4ed8); }
    .love-bg   { background: linear-gradient(90deg, #9d174d, #be185d); }

    /* 서브 다락방 (믿음1/믿음2 등) */
    .sub-block {
      background: white;
      border: 1px solid #e5e7eb;
      border-top: none;
      margin-bottom: 2px;
    }
    .sub-block:last-child { border-radius: 0 0 8px 8px; }

    .sub-header {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #e5e7eb;
    }
    .sub-header.faith-sub { background: #ede9fe; color: #5b21b6; border-left: 4px solid #7c3aed; }
    .sub-header.hope-sub  { background: #dbeafe; color: #1e40af; border-left: 4px solid #1d4ed8; }
    .sub-header.love-sub  { background: #fce7f3; color: #9d174d; border-left: 4px solid #be185d; }
    .sub-header .leader-tag { font-size: 11px; font-weight: 500; color: #666; }

    /* 순 테이블 */
    table {
      width: 100%;
      border-collapse: collapse;
    }
    thead tr { background: #f9fafb; }
    th {
      padding: 7px 10px;
      font-size: 11px;
      font-weight: 700;
      color: #888;
      text-align: left;
      border-bottom: 1px solid #e5e7eb;
      white-space: nowrap;
    }
    th:nth-child(1) { width: 36px; text-align: center; }
    th:nth-child(2) { width: 40px; text-align: center; }
    td {
      padding: 7px 10px;
      font-size: 12px;
      border-bottom: 1px solid #f3f4f6;
      vertical-align: top;
      word-break: keep-all;
      line-height: 1.8;
    }
    tr:last-child td { border-bottom: none; }
    td:nth-child(1) { text-align: center; color: #aaa; font-size: 11px; white-space: nowrap; }
    td:nth-child(2) { text-align: center; font-weight: 700; white-space: nowrap; }
    td:nth-child(3) { white-space: nowrap; }

    /* 모바일: 가로 스크롤 없이 순원 명단이 줄바꿈되어 보이도록 */
    .명단 { overflow-wrap: anywhere; }

    .순장 { font-weight: 700; color: #1e40af; }
    .순장 .leader-name { color: #1e40af; font-weight: 700; }
    .순장 .spouse-name { color: #111; font-weight: 500; }
    .명단 { color: #374151; }
    .temp { color: #f59e0b; font-size: 11px; }

    /* ── 이름 검색 ── */
    .search-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #f0f2f5;
      max-width: 1100px;
      margin: 0 auto;
      padding: 12px 16px 4px;
    }
    .search-bar input {
      width: 100%;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 15px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      background: white;
      outline: none;
    }
    .search-bar input:focus { border-color: #2d5a8e; box-shadow: 0 0 0 3px rgba(45,90,142,0.15); }
    .search-result { font-size: 12px; color: #666; padding: 6px 2px 0; min-height: 18px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .search-reset {
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      color: #1e3a5f;
      background: white;
      border: 1px solid #c7d2e0;
      border-radius: 20px;
      padding: 3px 12px;
      cursor: pointer;
    }
    .search-reset:hover { background: #e8eef6; }
    mark { background: #fde68a; color: inherit; padding: 0 1px; border-radius: 2px; }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 11px;
      color: #bbb;
    }

    @media (max-width: 600px) {
      .summary-bar { gap: 8px; }
      .summary-card.total .num { font-size: 26px; }
      .summary-card { padding: 10px 6px; }
      .summary-card .num { font-size: 18px; }
      .summary-card .label { font-size: 10px; }
      .container { padding: 0 8px; }
      .search-bar { padding: 10px 8px 4px; }
      th, td { padding: 6px 6px; }
      th:nth-child(1) { width: 28px; }
      th:nth-child(2) { width: 32px; }
    }
  </style>
  <script src="./org-data-default.js"></script>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>중종로공동체 다락방별 명단</h1>
    <div class="subtitle" id="revisedLine">총무 주웅현 · 최종수정 2026.11.04</div>
  </div>
</header>

<!-- 전체 현황 -->
<div class="summary-bar">
  <div class="summary-card total">
    <div class="num" data-ct-members="ALL">318명</div>
    <div class="label">총 인원 · <span data-ct-sun="ALL">34개 순</span></div>
  </div>
  <div class="summary-row3">
    <div class="summary-card faith">
      <div class="num" data-ct-members="GROUP:믿음">109명</div>
      <div class="label">믿음 다락방 (<span data-ct-sun="GROUP:믿음">12개 순</span>)</div>
    </div>
    <div class="summary-card hope">
      <div class="num" data-ct-members="GROUP:소망">55명</div>
      <div class="label">소망 다락방 (<span data-ct-sun="GROUP:소망">7개 순</span>)</div>
    </div>
    <div class="summary-card love">
      <div class="num" data-ct-members="GROUP:사랑">153명</div>
      <div class="label">사랑 다락방 (<span data-ct-sun="GROUP:사랑">15개 순</span>)</div>
    </div>
  </div>
</div>

<div class="search-bar">
  <input type="search" id="searchInput" placeholder="이름으로 검색 (예: 홍길동)" autocomplete="off" />
  <div class="search-result" id="searchResult"></div>
</div>

<div class="container" id="container">
  <div style="text-align:center;padding:40px 0;color:#999;">불러오는 중...</div>
</div>

<footer id="footerLine">중종로공동체 총무 주웅현 · 최종수정 20261104</footer>

<script>
var DB_GROUPS = [
  { key: '믿음', cls: 'faith', subs: ['믿음1', '믿음2'] },
  { key: '소망', cls: 'hope',  subs: ['소망1', '소망2'] },
  { key: '사랑', cls: 'love',  subs: ['사랑1', '사랑2'] },
];

function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ── 이름 검색 ── */
var _query = '';
var _lastData = null;

function matches(s) { return !!_query && String(s == null ? '' : s).indexOf(_query) !== -1; }

// esc() 후 검색어 부분을 <mark>로 감싸기
function hl(s) {
  var e = esc(s);
  if (!_query) return e;
  var q = esc(_query).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return e.replace(new RegExp(q, 'g'), '<mark>$&</mark>');
}

function sunMatches(sun) {
  return matches(sun.l1) || matches(sun.l2) || sun.members.some(matches);
}

function personCount(sun) {
  var n = (sun.l1 ? 1 : 0) + (sun.l2 ? 1 : 0);
  sun.members.forEach(function(m) { n += m.split(',').filter(function(s){ return s.trim(); }).length; });
  return n;
}

/* ── 순원 명단 기반 인원/순 개수 자동 집계 (community-totals.js 대체) ── */
function subTotals(sub) {
  var members = 0;
  sub.suns.forEach(function(sun) { members += personCount(sun); });
  return { members: members, sun: sub.suns.length };
}
function groupTotals(data, groupKey) {
  var g = DB_GROUPS.find(function(x) { return x.key === groupKey; });
  return g.subs.reduce(function(acc, subKey) {
    var t = subTotals(data.darakbang[subKey]);
    acc.members += t.members; acc.sun += t.sun;
    return acc;
  }, { members: 0, sun: 0 });
}
function grandTotals(data) {
  return DB_GROUPS.reduce(function(acc, g) {
    var t = groupTotals(data, g.key);
    acc.members += t.members; acc.sun += t.sun;
    return acc;
  }, { members: 1, sun: 0 }); // +1 = 담당목사
}
function orgCountLookup(data, key) {
  if (key === 'ALL') return grandTotals(data);
  if (key.indexOf('GROUP:') === 0) return groupTotals(data, key.slice(6));
  return subTotals(data.darakbang[key]);
}
function applyOrgCounts(data) {
  document.querySelectorAll('[data-ct-members]').forEach(function(el) {
    el.textContent = orgCountLookup(data, el.getAttribute('data-ct-members')).members + '명';
  });
  document.querySelectorAll('[data-ct-sun]').forEach(function(el) {
    el.textContent = orgCountLookup(data, el.getAttribute('data-ct-sun')).sun + '개 순';
  });
}

function leaderCellHTML(sun) {
  if (!sun.l1 && !sun.l2) return '—';
  var leader = '<span class="leader-name">' + hl(sun.l1) + '</span>';
  var spouse = sun.l2 ? '<span class="spouse-name">, ' + hl(sun.l2) + '</span>' : '';
  return leader + spouse;
}

function membersCellHTML(sun) {
  return sun.members.map(function(m) {
    if (m.indexOf('(임시)') !== -1) {
      var base = m.replace('(임시)', '').trim();
      return hl(base) + '<span class="temp">(임시)</span>';
    }
    return hl(m);
  }).join(' / ');
}

function render(data) {
  _lastData = data;
  var container = document.getElementById('container');
  container.innerHTML = '';
  var hitCount = 0;

  // 담당목사
  var pastorBlock = document.createElement('div');
  pastorBlock.className = 'darakbang-block';
  pastorBlock.innerHTML =
    '<div class="darakbang-title" style="background:linear-gradient(90deg,#1e3a5f,#2d5a8e);">담당목사</div>' +
    '<div class="sub-block" style="border-radius:0 0 8px 8px;">' +
      '<table><thead><tr><th>직분</th><th>이름</th></tr></thead>' +
      '<tbody><tr><td class="순장">담당목사</td><td class="명단">' + hl(data.leadership.pastor) + '</td></tr></tbody></table>' +
    '</div>';
  if (_query && !matches(data.leadership.pastor)) pastorBlock.style.display = 'none';
  else if (_query) hitCount++;
  container.appendChild(pastorBlock);

  DB_GROUPS.forEach(function(g) {
    // 검색 중이면 일치하는 순만 남김 (다락방장 이름만 일치하면 헤더만 표시)
    var visibleSuns = {};
    g.subs.forEach(function(subKey) {
      var sub = data.darakbang[subKey];
      visibleSuns[subKey] = !_query ? sub.suns : sub.suns.filter(sunMatches);
      if (_query) hitCount += visibleSuns[subKey].length + (matches(sub.leaderName) ? 1 : 0);
    });
    if (_query && g.subs.every(function(k) { return !visibleSuns[k].length && !matches(data.darakbang[k].leaderName); })) return;

    var block = document.createElement('div');
    block.className = 'darakbang-block';

    var title = document.createElement('div');
    title.className = 'darakbang-title ' + g.cls + '-bg';
    title.innerHTML = g.key + ' 다락방 <span class="count-badge"><span data-ct-members="GROUP:' + g.key + '"></span> · <span data-ct-sun="GROUP:' + g.key + '"></span></span>';
    block.appendChild(title);

    g.subs.forEach(function(subKey) {
      var sub = data.darakbang[subKey];
      if (_query && !visibleSuns[subKey].length && !matches(sub.leaderName)) return;
      var subBlock = document.createElement('div');
      subBlock.className = 'sub-block';
      subBlock.innerHTML =
        '<div class="sub-header ' + g.cls + '-sub">' + esc(sub.label) +
          ' <span class="count-badge" style="background:rgba(0,0,0,0.06);color:#555;padding:1px 8px;border-radius:20px;font-size:11px;"><span data-ct-members="' + subKey + '"></span> · <span data-ct-sun="' + subKey + '"></span></span>' +
          ' <span class="leader-tag">다락방장 ' + hl(sub.leaderName) + (sub.leaderRole ? ' ' + esc(sub.leaderRole) : '') + '</span>' +
        '</div>' +
        (!visibleSuns[subKey].length ? '' :
        '<table><thead><tr><th>순</th><th>인원</th><th>순장</th><th>순원</th></tr></thead><tbody>' +
        visibleSuns[subKey].map(function(sun) {
          return '<tr><td>' + sun.no + '</td><td>' + personCount(sun) + '</td>' +
            '<td class="순장">' + leaderCellHTML(sun) + '</td>' +
            '<td class="명단">' + membersCellHTML(sun) + '</td></tr>';
        }).join('') +
        '</tbody></table>');
      block.appendChild(subBlock);
    });

    container.appendChild(block);
  });

  applyOrgCounts(data);

  var resultEl = document.getElementById('searchResult');
  if (!_query) resultEl.innerHTML = '';
  else resultEl.innerHTML = '<span>' + (hitCount
      ? '"' + esc(_query) + '" 검색 결과 ' + hitCount + '건'
      : '"' + esc(_query) + '"에 해당하는 이름이 없습니다.') + '</span>' +
    '<button type="button" class="search-reset" onclick="resetSearch()">← 전체 명단 보기</button>';

  var revisedDate = (data.meta && data.meta.revisedDateOrg) || '20261104'; // 최종수정일 (관리자 페이지에서 수정)
  var rev = '총무 ' + data.leadership.secGenName + ' · 최종수정 ' +
    revisedDate.slice(0,4) + '.' + revisedDate.slice(4,6) + '.' + revisedDate.slice(6,8);
  document.getElementById('revisedLine').textContent = rev;
  document.getElementById('footerLine').innerHTML = '중종로공동체 총무 ' + esc(data.leadership.secGenName) + ' · 최종수정 ' + esc(revisedDate) + ' · <a href="./org-admin.html" style="color:#999;">관리자</a>';
}

var DB_URL = 'https://cgn-love-default-rtdb.asia-southeast1.firebasedatabase.app/orgdata2026.json';
var POLL_INTERVAL = 10000;
var _lastDataJSON = null;

function loadAndRender() {
  fetch(DB_URL, { cache: 'no-store' })
    .then(function(res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
    .then(function(data) {
      var d = (data && data.darakbang) ? data : ORG_DATA_DEFAULT;
      var json = JSON.stringify(d);
      if (json === _lastDataJSON) return; // 변경 없으면 다시 그리지 않음
      _lastDataJSON = json;
      render(d);
    })
    .catch(function() {
      if (_lastDataJSON === null) { _lastDataJSON = JSON.stringify(ORG_DATA_DEFAULT); render(ORG_DATA_DEFAULT); }
    });
}

function setQuery(q) {
  _query = q;
  if (_lastData) render(_lastData);
}

// 검색 시작 시 기록을 하나 쌓아서, 휴대폰 뒤로가기로 검색 전 화면으로 돌아갈 수 있게 함
function inSearchState() { return !!(history.state && history.state.search); }

function resetSearch() {
  document.getElementById('searchInput').value = '';
  setQuery('');
  if (inSearchState()) history.back();
}

document.getElementById('searchInput').addEventListener('input', function(e) {
  var q = e.target.value.replace(/\s+/g, '');
  if (q && !inSearchState()) { try { history.pushState({ search: true }, ''); } catch (err) {} }
  setQuery(q);
  if (!q && inSearchState()) history.back();
});

window.addEventListener('popstate', function() {
  if (inSearchState()) return;
  document.getElementById('searchInput').value = '';
  setQuery('');
});

loadAndRender();
setInterval(loadAndRender, POLL_INTERVAL);
</script>

</body>
</html>
